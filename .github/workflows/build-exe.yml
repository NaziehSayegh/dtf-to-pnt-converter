name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller tkinterdnd2
      - run: pyinstaller --onefile --windowed --collect-all tkinterdnd2 --name DTF2PNT dtf2pnt.py
      - uses: actions/upload-artifact@v4
        with:
          name: DTF2PNT-windows
          path: dist/DTF2PNT.exe
